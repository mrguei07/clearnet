# ---------------------------------------------------------------------------
# ClearNet — CI/CD — build release Android (AAB) industrialisé (Expo SDK 57).
# Déclencheurs : push sur main/develop, PR sur main, tags v* (release).
# Jobs : lint-backend, test-backend, lint-mobile, build-android (AAB), verify-aab,
#        notify, release (tags v* uniquement).
# Rétrocompatible : les workflows existants (ci-validation.yml, mobile-ci.yml)
# restent actifs pour les PR ; celui-ci est le pipeline de livraison.
# Build store alternatif (EAS, AAB+IPA) : release-store.yml.
# ---------------------------------------------------------------------------
name: CI/CD ClearNet

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api.clearnet.fr/api' }}

jobs:
  # ---------------- Backend ----------------
  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clearnet-backend/package-lock.json
      - name: npm ci
        working-directory: clearnet-backend
        run: npm ci
      - name: ESLint + Prettier (check)
        working-directory: clearnet-backend
        run: npx eslint . --ext .ts && npx prettier --check "src/**/*.ts"

  test-backend:
    name: Tests backend (Jest + BullMQ/Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clearnet-backend/package-lock.json
      - name: npm ci
        working-directory: clearnet-backend
        run: npm ci
      - name: npm run build
        working-directory: clearnet-backend
        run: npm run build
      - name: Jest (unitaires + intégration Redis)
        working-directory: clearnet-backend
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: npm test

  # ---------------- Mobile ----------------
  lint-mobile:
    name: Lint mobile (TS + ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clearnet-mobile/package-lock.json
      - name: npm ci
        working-directory: clearnet-mobile
        run: npm ci
      - name: TypeScript
        working-directory: clearnet-mobile
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: clearnet-mobile
        run: npx expo lint

  secrets-scan:
    name: Scan secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build AAB release (Expo SDK 57)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clearnet-mobile/package-lock.json

      - name: Composants Android SDK (idempotent)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: npm ci
        working-directory: clearnet-mobile
        run: npm ci

      - name: Expo prebuild (android/ non versionné)
        working-directory: clearnet-mobile
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('clearnet-mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: bundleRelease (AAB)
        working-directory: clearnet-mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ env.EXPO_PUBLIC_API_URL }}
        run: ./gradlew :app:bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: clearnet-mobile/android/app/build/outputs/bundle/release/app-release.aab

  verify-aab:
    name: Validation AAB (signature, taille)
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: artifacts
      - name: jarsigner verify + taille
        run: |
          aab="artifacts/app-release.aab"
          if [ ! -f "$aab" ]; then echo "AAB absente"; exit 1; fi
          size=$(stat -c%s "$aab")
          echo "Taille : $((size / 1024 / 1024)) Mo"
          if [ "$size" -lt 1048576 ]; then echo "AAB < 1 Mo ($size octets)"; exit 1; fi
          jarsigner -verify "$aab" | head -5
          echo "OK : AAB valide"

  notify:
    name: Notification Slack
    needs: [build-android, verify-aab]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notifier
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"ClearNet CI/CD : jobs $(echo '${{ toJson(needs) }}' | jq -r 'keys | join(", ")') — statut final ${{ needs.verify-aab.result }}\"}" \
            $SLACK_WEBHOOK_URL || true

  release:
    name: Release GitHub (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-aab, test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: artifacts
      - name: Créer la release avec l'AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/app-release.aab \
            --title "ClearNet ${{ github.ref_name }}" \
            --notes "AAB release (Play Store) — voir docs/STORE_SUBMISSION.md pour la soumission." || gh release upload "${{ github.ref_name }}" artifacts/app-release.aab --clobber
