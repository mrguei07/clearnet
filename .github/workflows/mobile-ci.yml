# ---------------------------------------------------------------------------
# ClearNet — CI mobile (point de vigilance 3.4, lot J8)
# Pull request touchant clearnet-mobile : build APK debug (Expo prebuild +
# Gradle), puis tests E2E Maestro sur émulateur Android 33 (flows login E2E
# et offline-sync). Rapport JUnit uploadé même en cas d'échec.
# ---------------------------------------------------------------------------
name: mobile-ci

on:
  pull_request:
    paths: ["clearnet-mobile/**", ".github/workflows/mobile-ci.yml"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clearnet-mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Expo dependencies
        working-directory: clearnet-mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: clearnet-mobile/android
        run: ./gradlew :app:assembleDebug -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clearnet-debug-apk
          path: clearnet-mobile/android/app/build/outputs/apk/debug/app-debug.apk

  maestro-e2e:
    name: E2E Maestro (émulateur)
    needs: build-apk
    runs-on: ubuntu-latest
    env:
      MAESTRO_VERSION: "3.5.0"   # version pinée (reproductibilité CI)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: clearnet-debug-apk
          path: apk

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Start emulator + run flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install apk/app-debug.apk
            ~/.maestro/bin/maestro test clearnet-mobile/.maestro/login.yaml
            ~/.maestro/bin/maestro test clearnet-mobile/.maestro/offline-sync.yaml
            ~/.maestro/bin/maestro test --format junit clearnet-mobile/.maestro/ > maestro-report.xml

      - name: Upload rapport Maestro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: maestro-report.xml