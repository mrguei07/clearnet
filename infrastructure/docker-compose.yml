services:
  neo4j:
    image: neo4j:5.26
    container_name: clearnet-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-clearnet123}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: clearnet-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ../clearnet-backend
    container_name: clearnet-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-clearnet123}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      DEMO_API_KEY: ${DEMO_API_KEY:-demo-secret-change-me}
      # Pont on-chain (voir clearnet-backend/.env.example)
      BLOCKCHAIN_ENABLED: ${BLOCKCHAIN_ENABLED:-false}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
      CLRN_TOKEN_ADDRESS: ${CLRN_TOKEN_ADDRESS:-}
      COMPENSATION_ENGINE_ADDRESS: ${COMPENSATION_ENGINE_ADDRESS:-}
      # ---- Phase 2 (règle d'or : désactivé par défaut) ----
      ITAR_ENABLED: ${ITAR_ENABLED:-false}
      OFAC_API_KEY: ${OFAC_API_KEY:-}
      OFAC_CSV_PATH: ${OFAC_CSV_PATH:-}
      ORACLES_ENABLED: ${ORACLES_ENABLED:-false}
      STORMGLASS_API_KEY: ${STORMGLASS_API_KEY:-}
      SPACE_TRACK_USER: ${SPACE_TRACK_USER:-}
      SPACE_TRACK_PASSWORD: ${SPACE_TRACK_PASSWORD:-}
      ORACLE_TIMEOUT_MS: ${ORACLE_TIMEOUT_MS:-2500}
      ZK_ENABLED: ${ZK_ENABLED:-false}
      VERIFIER_ADDRESS: ${VERIFIER_ADDRESS:-}
      ZK_ARTIFACTS_DIR: ${ZK_ARTIFACTS_DIR:-./zkartifacts}
      # ---- Industrialisation V1.3 (file BullMQ — off par défaut) ----
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_ATTEMPTS: ${QUEUE_ATTEMPTS:-5}
      QUEUE_BACKOFF_MS: ${QUEUE_BACKOFF_MS:-5000}
    ports:
      - "3000:3000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j-data:
  redis-data:
