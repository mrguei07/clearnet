# ---------------------------------------------------------------------------
# ClearNet — Topologie PRODUCTION (single-host, HTTPS via Caddy)
#
# Usage :
#   local (validation) :
#     docker compose --env-file infrastructure/.env.prod \
#       -f infrastructure/docker-compose.prod.yml up -d --build
#
#   VPS (public) : voir scripts/deploy-vps.sh (one-command).
#
# Différences avec docker-compose.yml (développement) :
#   - Seuls les ports 80/443 (Caddy) sont exposés à l'hôte. Neo4j/Redis/backend
#     ne sont PAS publiés : tout passe par le reverse proxy HTTPS.
#   - Secrets injectés via le fichier d'environnement (jamais de défaut en clair).
# ---------------------------------------------------------------------------

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: clearnet-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD requis}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clearnet-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ../clearnet-backend
    container_name: clearnet-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      DEMO_API_KEY: ${DEMO_API_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: clearnet-caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j-data:
  redis-data:
  caddy_data:
  caddy_config:
